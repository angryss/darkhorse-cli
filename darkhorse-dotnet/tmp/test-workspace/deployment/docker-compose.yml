# test-workspace — Docker Compose

services:
  backend:
    build:
      context: ../backend/
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    networks:
      - app-network

  # Uncomment as needed:
  # postgres:
  #   image: postgres:16-alpine
