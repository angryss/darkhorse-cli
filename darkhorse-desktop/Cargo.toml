[workspace]
resolver = "2"
members = [
    "crates/dh-domain",
    "crates/dh-application",
    "crates/dh-infrastructure",
    "crates/dh-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Angry Software Solutions"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Testing
assert_matches = "1.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
